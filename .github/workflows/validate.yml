name: Validate static site changes

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Test share interface
        run: node tests/test_share_ui.js
      - name: Test color theme preference
        run: node tests/test_color_theme.js
      - name: Test site generation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build site without deploying
        run: python3 scripts/build_site.py --output-dir "${RUNNER_TEMP}/handbook-site"
