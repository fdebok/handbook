# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Test share interface
        run: node tests/test_share_ui.js
      - name: Test color theme preference
        run: node tests/test_color_theme.js
      - name: Test share page generation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build static site
        run: python3 scripts/build_site.py --output-dir dist
      - name: Upload artifact
        # deploy-pages v5 requires upload-artifact v4 or later.
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: 'dist'
      - name: Allow Pages artifact availability to propagate
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify published discovery endpoints
        env:
          SITE_URL: https://www.fdebok.com
          INDEXNOW_KEY: e4d857d027c4cf696ae94c8f95b07043
        run: |
          set -euo pipefail

          fetch() {
            curl --fail --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 \
              "${SITE_URL}${1}"
          }

          apex_status="$(curl --location --output /dev/null --silent --show-error --write-out '%{http_code}' https://fdebok.com/)"
          test "${apex_status}" = "200"
          apex_location="$(curl --head --silent --show-error --max-time 20 https://fdebok.com/ | tr -d '\r' | sed -n 's/^location: //Ip' | head -n 1)"
          test "${apex_location}" = "https://www.fdebok.com/"

          robots="$(fetch /robots.txt)"
          grep -Fq "Sitemap: ${SITE_URL}/sitemap.xml" <<< "$robots"

          sitemap="$(fetch /sitemap.xml)"
          SITE_URL="$SITE_URL" SITEMAP_XML="$sitemap" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          sitemap_ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          xhtml_ns = "{http://www.w3.org/1999/xhtml}"
          root = ET.fromstring(os.environ["SITEMAP_XML"])
          urls = root.findall("sm:url", sitemap_ns)
          expected = {
              os.environ["SITE_URL"] + "/",
              os.environ["SITE_URL"] + "/en/",
          }
          locations = {
              element.findtext("sm:loc", namespaces=sitemap_ns)
              for element in urls
          }
          if locations != expected:
              raise SystemExit(f"Unexpected sitemap URLs: {locations}")
          for element in urls:
              alternates = {
                  link.attrib["hreflang"]: link.attrib["href"]
                  for link in element.findall(f"{xhtml_ns}link")
              }
              if alternates.get("zh-CN") != os.environ["SITE_URL"] + "/":
                  raise SystemExit(f"Missing Chinese hreflang alternate: {alternates}")
              if alternates.get("en") != os.environ["SITE_URL"] + "/en/":
                  raise SystemExit(f"Missing English hreflang alternate: {alternates}")
              if alternates.get("x-default") != os.environ["SITE_URL"] + "/en/":
                  raise SystemExit(f"Missing x-default alternate: {alternates}")
          PY

          chinese="$(fetch /)"
          grep -Fq '<html lang="zh-CN"' <<< "$chinese"
          grep -Fq '<link rel="canonical" href="https://www.fdebok.com/"/>' <<< "$chinese"
          grep -Fq 'hreflang="x-default" href="https://www.fdebok.com/en/"' <<< "$chinese"

          english="$(fetch /en/)"
          grep -Fq '<html lang="en"' <<< "$english"
          grep -Fq '<link rel="canonical" href="https://www.fdebok.com/en/"/>' <<< "$english"

          llms="$(fetch /llms.txt)"
          grep -Fq 'https://github.com/fdebok/handbook' <<< "$llms"
          security="$(fetch /.well-known/security.txt)"
          grep -Fq 'Contact: mailto:x@fdebok.com' <<< "$security"
          grep -Fq 'Expires: 2027-11-28T00:00:00.000Z' <<< "$security"
          grep -Fq 'Canonical: https://www.fdebok.com/.well-known/security.txt' <<< "$security"
          key_file="$(fetch "/${INDEXNOW_KEY}.txt")"
          test "$(tr -d '\r\n' <<< "$key_file")" = "$INDEXNOW_KEY"
      - name: Notify IndexNow
        # A notification failure must not invalidate a successful site deployment.
        continue-on-error: true
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data '{"host":"www.fdebok.com","key":"e4d857d027c4cf696ae94c8f95b07043","keyLocation":"https://www.fdebok.com/e4d857d027c4cf696ae94c8f95b07043.txt","urlList":["https://www.fdebok.com/","https://www.fdebok.com/en/"]}' \
            https://api.indexnow.org/indexnow
